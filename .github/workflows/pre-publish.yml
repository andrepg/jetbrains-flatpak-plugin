name: Pre-publish (schema regeneration + publish)

# Regenerates the bundled GTK schema from a pinned GNOME SDK before releasing,
# auto-commits any drift in src/main/resources/schemas/, then verifies and
# publishes the plugin to the JetBrains Marketplace.
#
# Requires the PUBLISH_TOKEN repository secret.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Regenerate schema, verify & publish
    runs-on: ubuntu-latest
    container:
      image: fedora:41
      options: --privileged
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Install flatpak tooling
        run: |
          dnf install -y flatpak git
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y org.gnome.Sdk//50

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure git for auto-commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@github-actions.local"

      - name: Regenerate bundled GTK schema
        run: ./gradlew generateBundledGtkSchema --no-daemon --stacktrace

      - name: Auto-commit schema drift (if any)
        run: |
          git add src/main/resources/schemas/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate bundled GTK schema"
            git push origin "${GITHUB_REF_NAME}"
          else
            echo "Bundled schema is in sync; nothing to commit."
          fi

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --no-daemon --stacktrace

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon --stacktrace
